name: step_tracker
description: "A new Flutter project for tracking steps."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  pedometer: ^4.0.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  fl_chart: ^0.68.0
  # Người 3 (mở rộng đăng nhập): crypto = băm mật khẩu; flutter_secure_storage = lưu tài khoản/phiên được mã hoá.
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
